name: TrainingPeaks to Intervals Sync

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: tp2intervals-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Madrid

    steps:
      - name: Start tp2intervals
        run: |
          docker run --detach --name tp2intervals \
            -p 127.0.0.1:8080:8080 \
            ghcr.io/freekode/tp2intervals:latest

      - name: Wait for tp2intervals
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs tp2intervals || true
          exit 1

      - name: Configure tp2intervals
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          TRAINING_PEAKS_AUTH_COOKIE: ${{ secrets.TRAINING_PEAKS_AUTH_COOKIE }}
        run: |
          for secret_name in \
            INTERVALS_API_KEY \
            INTERVALS_ATHLETE_ID \
            TRAINING_PEAKS_AUTH_COOKIE; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Required secret ${secret_name} is empty or unavailable."
              exit 1
            fi
          done

          config_payload=$(jq --null-input --compact-output \
            --arg intervals_api_key "$INTERVALS_API_KEY" \
            --arg intervals_athlete_id "$INTERVALS_ATHLETE_ID" \
            --arg training_peaks_auth_cookie "$TRAINING_PEAKS_AUTH_COOKIE" \
            '{
              config: {
                "intervals.api-key": $intervals_api_key,
                "intervals.athlete-id": $intervals_athlete_id,
                "training-peaks.auth-cookie": $training_peaks_auth_cookie
              }
            }')

          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Content-Type: application/json" \
            --data "$config_payload" \
            http://127.0.0.1:8080/api/configuration

      - name: Sync this calendar week
        run: |
          today=$(date +%F)
          weekday=$(date +%u)
          monday=$(date -d "${today} -$((weekday - 1)) days" +%F)
          sunday=$(date -d "${monday} +6 days" +%F)

          curl --fail-with-body --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{
              \"startDate\": \"${monday}\",
              \"endDate\": \"${sunday}\",
              \"types\": [
                \"BIKE\",
                \"VIRTUAL_BIKE\",
                \"MTB\",
                \"RUN\",
                \"SWIM\",
                \"WALK\",
                \"WEIGHT\",
                \"UNKNOWN\"
              ],
              \"skipSynced\": true,
              \"sourcePlatform\": \"TRAINING_PEAKS\",
              \"targetPlatform\": \"INTERVALS\"
            }" \
            http://127.0.0.1:8080/api/workout/copy-calendar-to-calendar

      - name: Show logs on failure
        if: failure()
        run: docker logs tp2intervals || true

      - name: Stop tp2intervals
        if: always()
        run: docker rm --force tp2intervals || true
